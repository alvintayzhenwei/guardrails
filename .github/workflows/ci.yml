name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseding a run is right on a pull request -- only the newest commit's
# result matters there. It is wrong on main: every commit that lands needs its
# own verdict, and the README badges report the latest run on the default
# branch, so a cancelled run there reads as "unverified" for the whole repo.
# Three Dependabot merges 24 seconds apart cancelled two main runs before this
# condition existed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The hook library is bash on every platform; on Windows that is the
      # Git Bash that ships with the runner, which is what run-hooks.ps1
      # delegates to in real use.
      - name: Behaviour suite
        shell: bash
        run: bash run-tests.sh

      - name: Adversarial suite
        shell: bash
        run: bash run-vuln-tests.sh

  powershell-launcher:
    name: PowerShell launcher smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: run-tests.ps1
        shell: pwsh
        run: pwsh -File run-tests.ps1
